plugins {
	id "architectury-plugin" version "3.4-SNAPSHOT"
	id "dev.architectury.loom" version "1.1-SNAPSHOT" apply false
}

architectury {
	minecraft = rootProject.minecraft_version
}

// VillagerTradingPlus is consumed from mavenLocal under a fixed version, and Loom keys its remapped
// copy of a dependency by that version - so a republished library never reaches the run without
// dropping that copy first. Run this on its own, then build:
//
//     gradlew dropLibraryCache
//     gradlew build
//
// Chaining both into one invocation fails: nothing orders the delete against the compile classpath,
// so the jar can be removed while a task is still resolving against it.
tasks.register("dropLibraryCache", Delete) {
	description = "Removes the cached remap of VillagerTradingPlus so a fresh publishToMavenLocal is picked up. Run on its own, before the build."
	group = "build"
	delete "${rootDir}/.gradle/loom-cache/remapped_mods/remapped/lion/villagertradingplus"
}

subprojects {
	apply plugin: "dev.architectury.loom"

	loom {
		silentMojangMappingsLicense()
	}

	dependencies {
		minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
		mappings "net.fabricmc:yarn:${rootProject.yarn_mappings}"
	}
}

allprojects {
	apply plugin: "java"
	apply plugin: "architectury-plugin"
	apply plugin: "maven-publish"

	archivesBaseName = rootProject.archives_base_name
	version = "${rootProject.mod_version}+mc${rootProject.minecraft_version}"
	group = rootProject.maven_group

	repositories {
		mavenLocal()
		maven { url 'https://jitpack.io' }
	}

	tasks.withType(JavaCompile) {
		options.encoding = "UTF-8"
		options.release = 17
	}

	java {
		withSourcesJar()
	}
}