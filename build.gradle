plugins {
	id "architectury-plugin" version "${architectury_plugin_version}"
	id "dev.architectury.loom-no-remap" version "${loom_version}" apply false
	id "com.gradleup.shadow" version "${shadow_version}" apply false
}

architectury {
	minecraft = rootProject.minecraft_version
}

subprojects {
	apply plugin: "dev.architectury.loom-no-remap"

	dependencies {
		minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
	}
}

allprojects {
	apply plugin: "java-library"
	apply plugin: "architectury-plugin"
	apply plugin: "maven-publish"

	base.archivesName = rootProject.archives_base_name
	version = "${rootProject.mod_version}+mc${rootProject.minecraft_version}"
	group = rootProject.maven_group

	repositories {
		mavenLocal()
		maven { url = 'https://maven.neoforged.net/releases' }
		maven { url = 'https://jitpack.io' }
		exclusiveContent {
			forRepository {
				maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
			}
			filter {
				includeGroupAndSubgroups('com.geckolib')
			}
		}
	}

	tasks.withType(JavaCompile).configureEach {
		options.encoding = "UTF-8"
		options.release = 25
		options.compilerArgs += ["-Xmaxerrs", "10000"]
	}

	java {
		withSourcesJar()
	}
}

evaluationDependsOn(":common")
evaluationDependsOn(":fabric")
evaluationDependsOn(":neoforge")