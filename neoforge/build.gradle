apply plugin: "com.gradleup.shadow"

base.archivesName = "graveyard-NEOFORGE"

loom {
	accessWidenerPath = project(":common").loom.accessWidenerPath

	neoForge {
		accessTransformer file("src/main/resources/META-INF/accesstransformer.cfg")
	}
}

architectury {
	platformSetupLoomIde()
	neoForge()
}

configurations {
	common
	shadowCommon
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	developmentNeoForge.extendsFrom common
}

repositories {
	maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
}

dependencies {
	neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"

	modImplementation "software.bernie.geckolib:geckolib-neoforge-${rootProject.minecraft_version}:${rootProject.geckolib_version_neoforge}"

	common(project(path: ":common", configuration: "namedElements")) { transitive false }
	shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive = false }

	// changing = true makes Gradle re-read the mavenLocal copy.
	modImplementation("lion.villagertradingplus:villagertradingplus-neoforge:${rootProject.villagertradingplus_version}+mc${rootProject.minecraft_version}") {
		changing = true
	}
}

configurations.all {
	resolutionStrategy.cacheChangingModulesFor 0, "seconds"
}

processResources {
	inputs.property "version", project.version

	filesMatching("META-INF/neoforge.mods.toml") {
		expand "version": project.version
	}
}

shadowJar {
	exclude "fabric.mod.json"
	exclude "architectury.common.json"

	configurations = [project.configurations.shadowCommon]
	archiveClassifier.set("dev-shadow")
}

remapJar {
	input.set shadowJar.archiveFile
	dependsOn shadowJar
	archiveClassifier.set("")
}

jar {
	archiveClassifier.set("dev")
}

sourcesJar {
	def commonSources = project(":common").sourcesJar
	dependsOn commonSources
	from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
	withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
		skip()
	}
}

publishing {
	publications {
		mavenNeoForge(MavenPublication) {
			artifactId = rootProject.archives_base_name + "-" + project.name
			from components.java
		}
	}

	repositories {
	}
}
