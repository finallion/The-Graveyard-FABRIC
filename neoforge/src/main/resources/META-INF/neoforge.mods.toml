modLoader = "javafml"
loaderVersion = "[4,)"
license = "GPL-3.0-only"

[[mods]]
modId = "graveyard"
version = "${version}"
displayName = "The Graveyard"
authors = "Finallion"
displayURL = "https://modrinth.com/mod/the-graveyard-forge"
issueTrackerURL = "https://github.com/finallion/The-Graveyard-FABRIC/issues"
description = '''
Adds new bosses, structures, mobs and blocks themed around the graveyard.

Support: https://www.patreon.com/cw/LithiumPlus
'''
logoFile = "graveyard_logo.png"

[[mixins]]
config = "graveyard-common.mixins.json"

[[mixins]]
config = "graveyard-neoforge.mixins.json"

[[dependencies.graveyard]]
modId = "neoforge"
type = "required"
versionRange = "[21.8.20,21.9.0)"
ordering = "NONE"
side = "BOTH"

[[dependencies.graveyard]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.8,1.21.9)"
ordering = "NONE"
side = "BOTH"

[[dependencies.graveyard]]
modId="geckolib"
type="required"
versionRange="[5.2.2,6)"
ordering="NONE"
side="BOTH"

# AFTER: the trade parser must have registered its types before our resource listener runs.
[[dependencies.graveyard]]
modId = "villagertradingplus"
type = "required"
versionRange = "[1.1.0,2)"
ordering = "AFTER"
side = "BOTH"
